services:
  seerrng:
    image: ghcr.io/snapetech/seerrng:${SEERRNG_TAG:-main}
    container_name: ${SEERRNG_CONTAINER_NAME:-seerrng-readonly}
    restart: unless-stopped
    init: true
    user: '1000:1000'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=0700
    environment:
      TZ: ${TZ:-America/Regina}
      PORT: 5055
      CONFIG_DIRECTORY: /app/config
      SEERR_EXTERNAL_READ_ONLY: 'true'
      SEERR_ALLOW_PRODUCTION_EXTERNAL_READ_ONLY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${SEERRNG_PORT:-5055}:5055'
    volumes:
      - ${SEERRNG_CONFIG_DIR:-./config}:/app/config
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:5055/api/v1/status/ready'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
