extensions:
  # createSafeHttpUrl performs scheme, credential, host, DNS, and private-address
  # validation before returning a URL that is used as a request target.
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierModel
    data:
      - ['@server/utils/security', 'Member[createSafeHttpUrl].ReturnValue.Awaited', 'request-forgery']
      - ['@server/utils/security', 'Member[createSafeHttpUrl].ReturnValue.Awaited', 'file-access-to-http']

  # Callers only use a URL after the asynchronous validator accepts it.
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierGuardModel
    data:
      - ['@server/utils/security', 'Member[isSafeHttpUrl].Argument[0]', 'true', 'request-forgery']

  # ExternalAPI validates configured origins and constrains every Axios request
  # to the configured origin. Its first argument is an administrator-controlled
  # service endpoint, including private addresses for self-hosted integrations.
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierModel
    data:
      - ['@server/api/externalapi', 'Member[ExternalAPI].Argument[0]', 'request-forgery']

  # Servarr URLs are administrator-configured service origins. This helper
  # rejects non-HTTP schemes, missing hosts, and embedded credentials before
  # the value becomes an ExternalAPI base URL.
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierModel
    data:
      - ['@server/api/servarr/base', 'Member[normalizeConfiguredServiceUrl].ReturnValue', 'request-forgery']
      - ['@server/api/servarr/base', 'Member[normalizeConfiguredServiceUrl].ReturnValue', 'file-access-to-http']
