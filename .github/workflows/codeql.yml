# ng-runner-policy: private-jit-only-v1
---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CodeQL

on:
  workflow_call:
    inputs:
      action_tag:
        type: string
        required: true
      runner_pool_tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        type: choice
        required: true
        options: [codeql]
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        type: choice
        required: true
        options: [private]
permissions:
  contents: read

concurrency:
  group: ng-scan-codeql-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: inputs.action_tag == 'codeql' && inputs.runner_pool_tag == 'private'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for CodeQL
        if: matrix.language == 'javascript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          packs: ${{ matrix.language == 'javascript' && 'snapetech/seerrng-codeql-models@0.0.15' || '' }}
          token: ${{ github.token }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: '/language:${{ matrix.language }}'

