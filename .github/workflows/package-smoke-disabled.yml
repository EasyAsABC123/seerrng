name: Package Smoke Disabled

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate
        required: true

permissions:
  contents: read

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: packaging/smoke/package-smoke seerrng github-archive "$RELEASE_TAG" --arch amd64
