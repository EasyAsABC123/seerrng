name: Android APK

on:
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/build-android-release.sh'
      - '.github/workflows/android.yml'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'scripts/build-android-release.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools'

      - name: Install Android SDK and emulator
        run: |
          mkdir -p "$RUNNER_TEMP/android-avd"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'emulator' \
            'system-images;android-36;google_apis;x86_64'
          echo no | avdmanager create avd \
            --name seerrng-api36 \
            --package 'system-images;android-36;google_apis;x86_64' \
            --device pixel_2 \
            --force
          test -x "$ANDROID_SDK_ROOT/emulator/emulator"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm || {
            echo 'Runner cannot access /dev/kvm; hardware accelerated emulator tests are unavailable.' >&2
            exit 1
          }

      - name: Run unit and emulator tests, then build debug APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd seerrng-api36 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/android-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb emu kill >/dev/null 2>&1 || true; wait "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 300s adb wait-for-device || {
            cat "$RUNNER_TEMP/android-emulator.log" >&2
            echo 'Android emulator did not register with ADB.' >&2
            exit 1
          }
          for attempt in {1..120}; do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == '1' ]]; then
              break
            fi
            sleep 2
          done
          [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == '1' ]] || {
            cat "$RUNNER_TEMP/android-emulator.log" >&2
            echo 'Android emulator did not finish booting.' >&2
            exit 1
          }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./android/gradlew --no-daemon -p android \
            :app:testDebugUnitTest \
            :app:connectedDebugAndroidTest \
            :app:assembleDebug
          ./android/gradlew --no-daemon -p android \
            -PandroidMonetizationMode=capped \
            -PfreeSessionLimit=2 \
            :app:testDebugUnitTest \
            :app:connectedDebugAndroidTest \
            :app:assembleDebug

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
