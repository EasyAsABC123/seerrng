---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish CodeQL Model Pack

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up CodeQL CLI
        id: setup-codeql
        uses: github/codeql-action/setup-codeql@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          tools: javascript

      - name: Publish model pack
        env:
          CODEQL: ${{ steps.setup-codeql.outputs.codeql-path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | "$CODEQL" pack publish \
            --github-auth-stdin \
            .github/codeql/model-pack
