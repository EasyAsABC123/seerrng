# ng-runner-policy: private-jit-only-v1
---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish CodeQL Model Pack
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options:
          - codeql
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        required: true
        type: choice
        options:
          - private

permissions:
  contents: read
  security-events: read

jobs:
  validate-main-ref:
    name: Validate main ref
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-validate-main-ref"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
      - name: Confirm main ref
        run: test "$GITHUB_REF" = 'refs/heads/main'

  publish:
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-publish"]}}', github.run_id)) }}
    needs: validate-main-ref
    if: needs.validate-main-ref.result == 'success'
    permissions:
      contents: read
      packages: write
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CodeQL CLI
        id: setup-codeql
        uses: github/codeql-action/setup-codeql@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Publish model pack
        env:
          CODEQL: ${{ steps.setup-codeql.outputs.codeql-path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | "$CODEQL" pack publish \
            --github-auth-stdin \
            .github/codeql/model-pack
