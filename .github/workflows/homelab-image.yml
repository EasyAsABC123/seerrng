---
name: Homelab Image

on:
  push:
    branches:
      - develop
      - delivery/book-isbn-format
      - delivery/default-both-book-formats

permissions:
  contents: read
  packages: write

concurrency:
  group: homelab-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate book requests and provider identity tracking
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect request UI changes
        id: request-ui
        run: |
          if git diff --quiet HEAD^ HEAD -- src/components/RequestModal/BookRequestModal.tsx server/utils/bookIsbnFormat.ts playwright/book-isbn-format.spec.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet HEAD^ HEAD -- server src package.json pnpm-lock.yaml; then
            echo "implementation=false" >> "$GITHUB_OUTPUT"
          else
            echo "implementation=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile

      - name: Run regression tests
        if: steps.request-ui.outputs.implementation == 'true'
        run: pnpm test server/utils/readarrService.test.ts server/utils/bookIsbnFormat.test.ts server/models/Book.test.ts server/lib/scanners/readarr/readarr.test.ts server/api/servarr/readarr.test.ts server/lib/bookRequestSearch.test.ts

      - name: Verify bulk ISBN hints do not become strict selections
        if: steps.request-ui.outputs.implementation == 'true'
        run: pnpm test server/routes/request.test.ts -t "zero-valued Bookshelf service and profile overrides in bulk book requests|defaults automatic book requests|explicit ebook service with the default audiobook"

      - name: Verify automatic and explicit edition import policies
        if: steps.request-ui.outputs.implementation == 'true'
        run: pnpm test server/test/MediaRequestSubscriber.test.ts -t "bare Hardcover edition id|no-ISBN translated OpenLibrary works|sends both-format book requests|ebook service link when the audiobook half"

      - name: Lint changed files
        if: steps.request-ui.outputs.implementation == 'true'
        run: pnpm exec eslint src/components/BookDetails/index.tsx src/components/RequestModal/BulkRequestModal.tsx server/entity/MediaRequest.ts server/utils/readarrService.ts server/utils/readarrService.test.ts server/subscriber/MediaRequestSubscriber.ts server/test/MediaRequestSubscriber.test.ts server/utils/bookIsbnFormat.ts server/utils/bookIsbnFormat.test.ts src/components/RequestModal/BookRequestModal.tsx server/routes/request.ts server/lib/scanners/readarr/index.ts server/lib/scanners/readarr/readarr.test.ts server/api/servarr/readarr.ts server/api/servarr/readarr.test.ts server/lib/bookRequestSearch.ts server/lib/bookRequestSearch.test.ts

      - name: Type-check
        if: steps.request-ui.outputs.implementation == 'true'
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare candidate browser configuration
        run: pnpm cypress:prepare
      - name: Verify candidate ISBN selection and geometry
        env:
          CI: true
        run: pnpm exec playwright test playwright/book-isbn-format.spec.ts playwright/book-both-formats.spec.ts --reporter=list
      - name: Render deployed baseline at matching viewports
        if: steps.request-ui.outputs.changed == 'true'
        env:
          CI: true
          BOOK_ISBN_BASELINE: '1'
          PORT: '5056'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5056
        run: |
          git fetch --no-tags origin 60f0114a048a2cdb6bc49b5540632c37af2b8b03
          git worktree add "$RUNNER_TEMP/isbn-baseline" FETCH_HEAD
          cp playwright/book-isbn-format.spec.ts playwright/book-both-formats.spec.ts "$RUNNER_TEMP/isbn-baseline/playwright/"
          cd "$RUNNER_TEMP/isbn-baseline"
          pnpm install --frozen-lockfile
          pnpm cypress:prepare
          pnpm build
          pnpm exec playwright test playwright/book-isbn-format.spec.ts playwright/book-both-formats.spec.ts --reporter=list
      - name: Preserve browser comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: book-isbn-format-${{ github.sha }}
          path: |
            test-results/
            ${{ runner.temp }}/isbn-baseline/test-results/
          retention-days: 7

  publish:
    name: Publish immutable image
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/easyasabc123/seerrng:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/develop' && 'ghcr.io/easyasabc123/seerrng:develop' || '' }}
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            BUILD_VERSION=develop
          cache-from: type=gha,scope=homelab-amd64
          cache-to: type=gha,mode=max,scope=homelab-amd64
          provenance: false

      - name: Report immutable image
        run: echo "ghcr.io/easyasabc123/seerrng@${{ steps.build.outputs.digest }}"
