name: Homelab Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build verified Chaptarr provider fix
    runs-on: [self-hosted, linux, x64, seerr-chaptarr-fix]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out exact fix commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EasyAsABC123/seerrng
          ref: 64c0dd7bb66a4443463a087ad5c6c993ec8d90d1
          persist-credentials: false
      - name: Confirm source identity
        run: test "$(git rev-parse HEAD)" = '64c0dd7bb66a4443463a087ad5c6c993ec8d90d1'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/easyasabc123/seerrng:chaptarr-fix-64c0dd7bb66a4443463a087ad5c6c993ec8d90d1
          build-args: |
            COMMIT_TAG=64c0dd7bb66a4443463a087ad5c6c993ec8d90d1
            BUILD_VERSION=main
          labels: |
            org.opencontainers.image.source=https://github.com/EasyAsABC123/seerrng
            org.opencontainers.image.revision=64c0dd7bb66a4443463a087ad5c6c993ec8d90d1
          cache-from: type=gha,scope=upstream-main-amd64
          cache-to: type=gha,mode=max,scope=upstream-main-amd64
      - name: Record immutable image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "ghcr.io/easyasabc123/seerrng@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$IMAGE_DIGEST" > image-digest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seerr-chaptarr-image-digest
          path: image-digest.txt
