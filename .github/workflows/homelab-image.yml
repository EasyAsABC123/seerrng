---
name: Homelab Image

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: homelab-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate develop fixes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile

      - name: Run regression tests
        run: pnpm test server/api/externalapi.test.ts

      - name: Lint changed files
        run: pnpm exec eslint server/api/externalapi.ts server/api/externalapi.test.ts

      - name: Type-check
        run: pnpm typecheck

  publish:
    name: Publish immutable image
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/easyasabc123/seerrng:sha-${{ github.sha }}
            ghcr.io/easyasabc123/seerrng:develop
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            BUILD_VERSION=develop
          cache-from: type=gha,scope=homelab-amd64
          cache-to: type=gha,mode=max,scope=homelab-amd64
          provenance: false

      - name: Report immutable image
        run: echo "ghcr.io/easyasabc123/seerrng@${{ steps.build.outputs.digest }}"
