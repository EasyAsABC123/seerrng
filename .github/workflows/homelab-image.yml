name: Homelab Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build unmodified upstream main
    runs-on: [self-hosted, linux, x64, seerr-main-4f5541a]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out exact upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: snapetech-org/seerrng
          ref: 4f5541aa5d83cb95e2cbd214ebda72d025d5daf6
          persist-credentials: false
      - name: Confirm source identity
        run: test "$(git rev-parse HEAD)" = '4f5541aa5d83cb95e2cbd214ebda72d025d5daf6'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/easyasabc123/seerrng:upstream-main-4f5541aa5d83cb95e2cbd214ebda72d025d5daf6
          build-args: |
            COMMIT_TAG=4f5541aa5d83cb95e2cbd214ebda72d025d5daf6
            BUILD_VERSION=main
          labels: |
            org.opencontainers.image.source=https://github.com/snapetech-org/seerrng
            org.opencontainers.image.revision=4f5541aa5d83cb95e2cbd214ebda72d025d5daf6
          cache-from: type=gha,scope=upstream-main-amd64
          cache-to: type=gha,mode=max,scope=upstream-main-amd64
      - name: Record immutable image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "ghcr.io/easyasabc123/seerrng@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$IMAGE_DIGEST" > image-digest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seerr-main-image-digest
          path: image-digest.txt
