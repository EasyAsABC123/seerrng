name: Public fork PR validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-fork-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    name: Build and test docs website
    if: github.event.pull_request.head.repo.fork == true
    permissions:
      contents: read
    uses: snapetech-org/seerrng/.github/workflows/test-docs.yml@refs/heads/main

