---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: SeerrNG CI

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_HUB: snapetech/seerrng
  GHCR_IMAGE: ghcr.io/snapetech-org/seerrng

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  engine-plan:
    name: Validation engine plan
    if: >-
      github.event_name == 'pull_request' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      planSha256: ${{ steps.plan.outputs.planSha256 }}
      runId: ${{ steps.plan.outputs.runId }}
      runAttempt: ${{ steps.plan.outputs.runAttempt }}
      executionSha: ${{ steps.plan.outputs.executionSha }}
      headSha: ${{ steps.plan.outputs.headSha }}
      codeql: ${{ steps.plan.outputs.codeql }}
      cypress: ${{ steps.plan.outputs.cypress }}
      playwright: ${{ steps.plan.outputs.playwright }}
      testDocs: ${{ steps.plan.outputs.testDocs }}
      docsLinks: ${{ steps.plan.outputs.docsLinks }}
      helm: ${{ steps.plan.outputs.helm }}
      unitMatrix: ${{ steps.plan.outputs.unitMatrix }}
      cypressMatrix: ${{ steps.plan.outputs.cypressMatrix }}
    steps:
      - name: Checkout complete candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Create current-run hosted validation plan
        id: plan
        run: |
          mkdir -p "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan"
          node bin/run-local-validation.mjs \
            --github-plan \
            --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json" \
            --json

      - name: Publish immutable current-attempt validation plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-single/plan/hosted-plan.json
          if-no-files-found: error
          retention-days: 1

      - name: Clean attempt-scoped engine workspace
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}"

  jellyfin-plugin:
    name: Build Jellyfin bridge plugin
    needs: engine-plan
    timeout-minutes: 15
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      (github.event_name == 'pull_request' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ needs.engine-plan.outputs.runId }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ needs.engine-plan.outputs.runAttempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ needs.engine-plan.outputs.executionSha }}
      SEERRNG_ENGINE_UNIT_ID: ci-jellyfin-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for engine binding
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Download immutable validation plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.case_id || 'single' }}/plan

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Admit engine unit
        id: engine-admission
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --json

      - name: Build plugin
        if: steps.engine-admission.outputs.execute == 'true'
        run: >-
          dotnet publish
          integrations/jellyfin-plugin/SeerrNG.JellyfinBridge.csproj
          --configuration Release
          --output artifacts/seerrng-jellyfin-bridge

      - name: Smoke test plugin in Jellyfin 10.11.11
        if: steps.engine-admission.outputs.execute == 'true'
        run: >-
          python3 integrations/jellyfin-plugin/smoke-test.py
          --plugin-output artifacts/seerrng-jellyfin-bridge

      - name: Seal engine unit receipt
        if: always() && steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --job-status "${{ job.status }}"
          --json

      - name: Publish engine unit receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-ci-jellyfin-plugin
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.case_id || 'single' }}/receipts
          if-no-files-found: error
          retention-days: 1

      - name: Clean attempt-scoped engine workspace
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}"

  release-notes:
    name: Release-note contract
    needs: engine-plan
    timeout-minutes: 10
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.user.type != 'Bot'))
    runs-on: ubuntu-latest
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ needs.engine-plan.outputs.runId }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ needs.engine-plan.outputs.runAttempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ needs.engine-plan.outputs.executionSha }}
      SEERRNG_ENGINE_UNIT_ID: ci-release-notes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Download immutable validation plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.case_id || 'single' }}/plan

      - name: Admit engine unit
        id: engine-admission
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --json

      - name: Validate release-note fragment or explicit opt-out
        if: steps.engine-admission.outputs.execute == 'true'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          # Push events do not include a pull-request body. Manual runs validate
          # this commit's release-note files but are not new release-note commits.
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            base_sha="$(git rev-parse --verify "${HEAD_SHA}^1")"
          fi
          body_file="$RUNNER_TEMP/pr-body.md"
          printf '%s' "$PR_BODY" > "$body_file"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && git diff --quiet "$base_sha" "$HEAD_SHA" -- release-notes; then
            printf '%s' 'release-note: none' > "$body_file"
          fi
          validation_args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            validation_args+=(--allow-mixed-push-batch)
          fi
          node scripts/check-release-notes.mjs \
            --base "$base_sha" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            "${validation_args[@]}"
          node scripts/check-changelog-tags.mjs

      - name: Seal engine unit receipt
        if: always() && steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --job-status "${{ job.status }}"
          --json

      - name: Publish engine unit receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-ci-release-notes
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.case_id || 'single' }}/receipts
          if-no-files-found: error
          retention-days: 1

      - name: Clean attempt-scoped engine workspace
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}"

  i18n:
    name: i18n Check
    needs: engine-plan
    timeout-minutes: 30
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      (github.event_name == 'pull_request' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ needs.engine-plan.outputs.runId }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ needs.engine-plan.outputs.runAttempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ needs.engine-plan.outputs.executionSha }}
      SEERRNG_ENGINE_UNIT_ID: ci-i18n
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'

      - name: Download immutable validation plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.case_id || 'single' }}/plan

      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-node24-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-store-

      - name: Install dependencies
        env:
          CI: true
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install

      - name: Admit engine unit
        id: engine-admission
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --json

      - name: i18n Check
        if: steps.engine-admission.outputs.execute == 'true'
        run: node bin/check-i18n.js

      - name: Security council and tooling tests
        if: steps.engine-admission.outputs.execute == 'true'
        run: pnpm security:council

      - name: Seal engine unit receipt
        if: always() && steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --job-status "${{ job.status }}"
          --json

      - name: Publish engine unit receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-ci-i18n
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.case_id || 'single' }}/receipts
          if-no-files-found: error
          retention-days: 1

      - name: Clean attempt-scoped engine workspace
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}"

  test:
    name: Lint & Test Build
    needs: engine-plan
    timeout-minutes: 30
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      (github.event_name == 'pull_request' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    container:
      image: node:24.21.0-alpine3.23@sha256:9ec4a2e289874ed0d722e1772ec2de45d2801541db8612f3638b26f128c69ac2
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ needs.engine-plan.outputs.runId }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ needs.engine-plan.outputs.runAttempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ needs.engine-plan.outputs.executionSha }}
      SEERRNG_ENGINE_UNIT_ID: ci-test
    steps:
      - name: Install Git for complete checkout
        run: apk add --no-cache git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download immutable validation plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.case_id || 'single' }}/plan

      - name: Install native build tools
        run: apk add --no-cache python3 py3-setuptools make g++ gcc libc6-compat

      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Get pnpm store directory
        shell: sh
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-node24-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-store-

      - name: Install dependencies
        env:
          CI: true
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install

      - name: Admit engine unit
        id: engine-admission
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --json

      - name: Lint
        if: steps.engine-admission.outputs.execute == 'true'
        run: pnpm lint

      - name: Formatting
        id: formatting
        if: steps.engine-admission.outputs.execute == 'true'
        run: pnpm format:check

      - name: Report exact formatter correction
        if: failure() && steps.formatting.outcome == 'failure'
        run: |
          pnpm format
          git diff --no-ext-diff -- .

      - name: Build
        if: steps.engine-admission.outputs.execute == 'true'
        run: pnpm build

      - name: Bundle budget
        if: steps.engine-admission.outputs.execute == 'true'
        run: pnpm bundle:check

      - name: Seal engine unit receipt
        if: always() && steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --job-status "${{ job.status }}"
          --json

      - name: Publish engine unit receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-ci-test
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.case_id || 'single' }}/receipts
          if-no-files-found: error
          retention-days: 1

      - name: Clean attempt-scoped engine workspace
        if: always()
        shell: sh
        run: |
          rm -rf -- "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}"

  unit-test:
    name: Unit Tests (${{ matrix.case_id }})
    needs: engine-plan
    timeout-minutes: 75
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      (github.event_name == 'pull_request' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'))
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.engine-plan.outputs.unitMatrix) }}
    # Unit shards run on ephemeral GitHub-hosted runners.
    runs-on: ubuntu-latest
    container:
      image: node:24.21.0-alpine3.23@sha256:9ec4a2e289874ed0d722e1772ec2de45d2801541db8612f3638b26f128c69ac2
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ needs.engine-plan.outputs.runId }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ needs.engine-plan.outputs.runAttempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ needs.engine-plan.outputs.executionSha }}
      SEERRNG_ENGINE_UNIT_ID: ci-unit-test
      SEERRNG_ENGINE_CASE_ID: ${{ matrix.case_id }}
    steps:
      - name: Install Git for complete checkout
        run: apk add --no-cache git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download immutable validation plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.case_id || 'single' }}/plan

      - name: Install native build tools
        run: apk add --no-cache python3 py3-setuptools make g++ gcc libc6-compat

      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Get pnpm store directory
        shell: sh
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
          echo "LOCK_HASH=$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-node24-pnpm-store-${{ env.LOCK_HASH }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-store-

      - name: Install dependencies
        env:
          CI: true
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install

      - name: Admit engine unit
        id: engine-admission
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --case "$SEERRNG_ENGINE_CASE_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --json

      - name: Materialize planned Vitest shard
        if: steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-materialize-test-lane
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --case "$SEERRNG_ENGINE_CASE_ID"
          --lane vitest
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --output-file "$RUNNER_TEMP/seerrng-engine-vitest.config.mts"
          --json

      - name: Run tests
        if: steps.engine-admission.outputs.execute == 'true'
        env:
          CI: true
        run: >-
          pnpm test:ci
          --config "$RUNNER_TEMP/seerrng-engine-vitest.config.mts"

      - name: Run engine-owned native Node tests
        if: always() && steps.engine-admission.outputs.execute == 'true'
        env:
          CI: true
        run: >-
          node bin/run-local-validation.mjs
          --github-run-test-lane
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --case "$SEERRNG_ENGINE_CASE_ID"
          --lane node-test-mjs
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --report-file "$RUNNER_TEMP/seerrng-engine-node-tests.json"
          --json

      - name: Publish test report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: >-
          (success() || failure()) &&
          steps.engine-admission.outputs.execute == 'true'
        with:
          report_paths: 'report.xml'
          annotate_only: true

      - name: Seal engine unit receipt
        if: always() && steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --case "$SEERRNG_ENGINE_CASE_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --job-status "${{ job.status }}"
          --evidence report.xml
          --evidence "$RUNNER_TEMP/seerrng-engine-node-tests.json"
          --json

      - name: Publish engine unit receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-ci-unit-test-${{ matrix.case_id }}
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.case_id || 'single' }}/receipts
          if-no-files-found: error
          retention-days: 1

      - name: Clean attempt-scoped engine workspace
        if: always()
        shell: sh
        run: |
          rm -rf -- "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}"

  codeql:
    name: CodeQL
    needs: engine-plan
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      needs.engine-plan.outputs.codeql == 'true'
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      plan_sha256: ${{ needs.engine-plan.outputs.planSha256 }}
      engine_run_id: ${{ needs.engine-plan.outputs.runId }}
      engine_run_attempt: ${{ needs.engine-plan.outputs.runAttempt }}
      execution_sha: ${{ needs.engine-plan.outputs.executionSha }}
      unit_id: codeql-analyze

  playwright:
    name: Playwright Tests
    needs: engine-plan
    timeout-minutes: 45
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      needs.engine-plan.outputs.playwright == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ needs.engine-plan.outputs.runId }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ needs.engine-plan.outputs.runAttempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ needs.engine-plan.outputs.executionSha }}
      SEERRNG_ENGINE_UNIT_ID: ci-playwright
      PORT: '5055'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5055
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Download immutable validation plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.case_id || 'single' }}/plan

      - name: Install dependencies
        env:
          CI: true
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure Playwright runtime
        run: |
          printf 'CONFIG_DIRECTORY=%s\n' "$RUNNER_TEMP/seerrng-playwright-runtime-config" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_JSON_OUTPUT_FILE=%s\n' "$RUNNER_TEMP/seerrng-engine-playwright-result.json" >> "$GITHUB_ENV"

      - name: Prepare Playwright runtime configuration
        run: pnpm cypress:prepare

      - name: Admit engine unit
        id: engine-admission
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --json

      - name: Build Playwright application once on Ubuntu
        if: steps.engine-admission.outputs.execute == 'true'
        run: pnpm build

      - name: Run native Playwright suite
        if: steps.engine-admission.outputs.execute == 'true'
        env:
          CI: true
        run: pnpm exec playwright test --reporter=json

      - name: Seal engine unit receipt
        if: always() && steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --job-status "${{ job.status }}"
          --evidence "$PLAYWRIGHT_JSON_OUTPUT_FILE"
          --json

      - name: Publish engine unit receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-ci-playwright
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.case_id || 'single' }}/receipts
          if-no-files-found: error
          retention-days: 1

      - name: Clean attempt-scoped engine workspace
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}"

  cypress:
    name: Cypress Tests (${{ matrix.case_id }})
    needs: engine-plan
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      needs.engine-plan.outputs.cypress == 'true'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.engine-plan.outputs.cypressMatrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/cypress.yml
    with:
      plan_sha256: ${{ needs.engine-plan.outputs.planSha256 }}
      engine_run_id: ${{ needs.engine-plan.outputs.runId }}
      engine_run_attempt: ${{ needs.engine-plan.outputs.runAttempt }}
      execution_sha: ${{ needs.engine-plan.outputs.executionSha }}
      unit_id: cypress-run
      case_id: ${{ matrix.case_id }}
      specs: ${{ matrix.specs }}
    secrets:
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

  test-docs:
    name: Test Docs
    needs: engine-plan
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      needs.engine-plan.outputs.testDocs == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test-docs.yml
    with:
      plan_sha256: ${{ needs.engine-plan.outputs.planSha256 }}
      engine_run_id: ${{ needs.engine-plan.outputs.runId }}
      engine_run_attempt: ${{ needs.engine-plan.outputs.runAttempt }}
      execution_sha: ${{ needs.engine-plan.outputs.executionSha }}
      unit_id: test-docs-build

  docs-links:
    name: Check Docs Links
    needs: engine-plan
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      needs.engine-plan.outputs.docsLinks == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/docs-link-check.yml
    with:
      plan_sha256: ${{ needs.engine-plan.outputs.planSha256 }}
      engine_run_id: ${{ needs.engine-plan.outputs.runId }}
      engine_run_attempt: ${{ needs.engine-plan.outputs.runAttempt }}
      execution_sha: ${{ needs.engine-plan.outputs.executionSha }}
      unit_id: docs-links

  helm:
    name: Lint and Test Charts
    needs: engine-plan
    if: >-
      always() &&
      !cancelled() &&
      needs.engine-plan.result == 'success' &&
      needs.engine-plan.outputs.helm == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/lint-helm-charts.yml
    with:
      plan_sha256: ${{ needs.engine-plan.outputs.planSha256 }}
      engine_run_id: ${{ needs.engine-plan.outputs.runId }}
      engine_run_attempt: ${{ needs.engine-plan.outputs.runAttempt }}
      execution_sha: ${{ needs.engine-plan.outputs.executionSha }}
      unit_id: helm-lint-test

  engine-reconcile:
    name: Native validation engine result
    needs:
      - engine-plan
      - jellyfin-plugin
      - release-notes
      - i18n
      - test
      - unit-test
      - codeql
      - playwright
      - cypress
      - test-docs
      - docs-links
      - helm
    if: >-
      always() &&
      !cancelled() &&
      (github.event_name == 'pull_request' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ needs.engine-plan.outputs.runId }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ needs.engine-plan.outputs.runAttempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ needs.engine-plan.outputs.executionSha }}
    steps:
      - name: Checkout complete candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Download immutable validation plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.case_id || 'single' }}/plan

      - name: Download current-attempt engine receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.case_id || 'single' }}/receipts
          merge-multiple: true

      - name: Reconcile current-run hosted validation results
        env:
          SEERRNG_ENGINE_NEEDS_JSON: ${{ toJSON(needs) }}
          SEERRNG_ENGINE_EXPECTED_PLAN_SHA256: ${{ needs.engine-plan.outputs.planSha256 }}
        run: >-
          node bin/run-local-validation.mjs
          --github-reconcile
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --json

      - name: Clean attempt-scoped engine workspace
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}"

  publish:
    name: Publish multi-arch image
    timeout-minutes: 90
    needs: engine-reconcile
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.engine-reconcile.result == 'success'
    concurrency:
      group: seerrng-main-image-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.resolve-digest.outputs.image_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Commit timestamp
        id: ts
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Image channel
        id: channel
        run: echo "CHANNEL=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.channel.outputs.CHANNEL }}
            type=sha
          labels: |
            org.opencontainers.image.created=${{ steps.ts.outputs.TIMESTAMP }}

      - name: Resolve base images with retry
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t base_images < <(
            awk '
              toupper($1) == "FROM" {
                image = ""
                for (i = 2; i <= NF; i++) {
                  if ($i ~ /^--/) {
                    continue
                  }
                  image = $i
                  break
                }
                if (image != "") {
                  images[image] = 1
                }
                for (i = 2; i < NF; i++) {
                  if (toupper($i) == "AS") {
                    aliases[$(i + 1)] = 1
                  }
                }
              }
              END {
                for (image in images) {
                  if (!(image in aliases)) {
                    print image
                  }
                }
              }
            ' Dockerfile | sort -u
          )
          for image in "${base_images[@]}"; do
            for attempt in 1 2 3 4 5; do
              echo "Resolving ${image} (attempt ${attempt}/5)"
              if docker buildx imagetools inspect "$image" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Unable to resolve ${image} after ${attempt} attempts" >&2
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done

      - name: Build & Push (multi-arch, single tag)
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_LABELS: ${{ steps.meta.outputs.labels }}
          COMMIT_TAG: ${{ github.sha }}
          BUILD_VERSION: ${{ steps.channel.outputs.CHANNEL }}
          SOURCE_DATE_EPOCH: ${{ steps.ts.outputs.TIMESTAMP }}
        run: |
          set -euo pipefail

          build_args=(
            --file ./Dockerfile
            --platform linux/amd64,linux/arm64
            --push
            --build-arg "COMMIT_TAG=${COMMIT_TAG}"
            --build-arg "BUILD_VERSION=${BUILD_VERSION}"
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
            --cache-from type=gha,scope=linux/amd64
            --cache-from type=gha,scope=linux/arm64
            --cache-to type=gha,mode=max
            --provenance mode=max
          )

          while IFS= read -r tag; do
            [ -n "$tag" ] && build_args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"

          while IFS= read -r label; do
            [ -n "$label" ] && build_args+=(--label "$label")
          done <<< "$IMAGE_LABELS"

          for attempt in 1 2 3; do
            echo "Building and pushing image (attempt ${attempt}/3)"
            if docker buildx build "${build_args[@]}" .; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Image build/push failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Verify published architectures
        shell: bash
        run: |
          set -euo pipefail
          image_name="${GHCR_IMAGE}"
          scripts/verify-container-manifest.sh --require-provenance "${image_name}:main" linux/amd64 linux/arm64
          scripts/verify-container-manifest.sh --require-provenance "${image_name}:sha-${GITHUB_SHA::7}" linux/amd64 linux/arm64

      - name: Resolve published image digest
        id: resolve-digest
        shell: bash
        run: |
          set -euo pipefail
          image_name="${GHCR_IMAGE}"
          for attempt in 1 2 3 4 5; do
            echo "Resolving published image digest (attempt ${attempt}/5)"
            if digest=$(docker buildx imagetools inspect "${image_name}:main" --format '{{json .Manifest.Digest}}' | tr -d '"') &&
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Unable to resolve the published image digest after 5 attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

  scan-main-image:
    name: Scan main image (${{ matrix.platform }})
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.engine-reconcile.result == 'success' &&
      needs.publish.result == 'success'
    needs: [publish, engine-reconcile]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      TRIVY_CACHE_DIR: .trivycache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivycache
          key: trivy-${{ runner.os }}-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Run Trivy image scan
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          trivy image \
            --platform "$PLATFORM" \
            --format sarif \
            --output "trivy-main-${{ matrix.suffix }}.sarif" \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${GHCR_IMAGE}@${IMAGE_DIGEST}"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-main-${{ matrix.suffix }}.sarif
          category: trivy-main-${{ matrix.suffix }}
