---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Create tag

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - SeerrNG CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  determine-tag-version:
    name: Determine tag version
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'SeerrNG CI' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_version: ${{ steps.git-cliff.outputs.tag_version }}
      base_sha: ${{ steps.git-cliff.outputs.base_sha }}
      release_required: ${{ steps.git-cliff.outputs.release_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Install git-cliff
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: git-cliff

      - name: Get tag version
        id: git-cliff
        env:
          # In order to avoid hitting the GitHub API rate limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_run' ]]; then
            [[ "$WORKFLOW_RUN_CONCLUSION" == 'success' &&
              "$WORKFLOW_RUN_EVENT" == 'push' &&
              "$WORKFLOW_RUN_HEAD_BRANCH" == 'main' &&
              "$WORKFLOW_RUN_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" &&
              "$WORKFLOW_RUN_HEAD_SHA" == "$base_sha" ]] || {
              echo 'The automatic release must use successful main push CI from this repository.' >&2
              exit 2
            }

            current_main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
            if [[ "$current_main_sha" != "$base_sha" ]]; then
              echo "CI passed for stale main revision ${base_sha}; current main is ${current_main_sha}. Skipping release."
              {
                echo "base_sha=${base_sha}"
                echo 'release_required=false'
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            previous_tag="$(scripts/latest-published-release-tag.sh)"
            release_note_changes="$(git diff --name-status "$previous_tag" "$base_sha" -- release-notes)"
            release_note_count="$(awk -F '\t' '$1 == "A" && $2 ~ /^release-notes\/[^/]+\.md$/ && $2 != "release-notes/README.md" { count++ } END { print count + 0 }' <<<"$release_note_changes")"
            if [[ "$release_note_count" == '0' ]]; then
              echo "No new curated release notes since ${previous_tag}; skipping automatic release."
              {
                echo "base_sha=${base_sha}"
                echo 'release_required=false'
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          tag_version=$(git-cliff -c .github/cliff.toml --bumped-version --unreleased)
          [[ "$tag_version" =~ ^v[0-9][0-9A-Za-z._+-]{0,127}$ ]] || {
            echo "Invalid generated tag version: $tag_version" >&2
            exit 2
          }
          echo "Next tag version is ${tag_version}"
          {
            echo "tag_version=${tag_version}"
            echo "base_sha=${base_sha}"
            echo 'release_required=true'
          } >> "$GITHUB_OUTPUT"

  create-tag:
    name: Create tag
    if: needs.determine-tag-version.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: determine-tag-version
    outputs:
      tag_version: ${{ needs.determine-tag-version.outputs.tag_version }}
      base_sha: ${{ steps.package-release.outputs.base_sha }}
      release_sha: ${{ steps.package-release.outputs.release_sha }}
    env:
      TAG_VERSION: ${{ needs.determine-tag-version.outputs.tag_version }}
      BASE_SHA: ${{ needs.determine-tag-version.outputs.base_sha }}
    steps:
      - name: Install git-cliff
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: git-cliff

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release branch
        run: git switch --force-create release-candidate "$BASE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          # For workflows with elevated privileges we recommend disabling automatic caching.
          # https://github.com/actions/setup-node
          package-manager-cache: false

      - name: Configure git
        env:
          GIT_ACTOR: ${{ github.actor }}
        run: |
          git config user.name "$GIT_ACTOR"
          git config user.email "$GIT_ACTOR@users.noreply.github.com"

      - name: Bump package.json
        run: |
          current_version="$(node -p 'require("./package.json").version')"
          target_version="${TAG_VERSION#v}"
          if [[ "$current_version" == "$target_version" ]]; then
            echo "package.json is already at $TAG_VERSION; skipping version bump"
          else
            npm version "$TAG_VERSION" --ignore-scripts --no-commit-hooks --no-git-tag-version
          fi

      - name: Sync Helm chart release metadata
        run: |
          set -euo pipefail
          node scripts/update-helm-release-metadata.mjs "$TAG_VERSION"

      - name: Generate checked-in changelog
        shell: bash
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          previous_tag="$(scripts/latest-published-release-tag.sh)"
          current_changelog="${RUNNER_TEMP}/seerrng-current-changelog.md"
          git-cliff \
            -c .github/cliff.toml \
            --unreleased \
            --tag "$TAG_VERSION" \
            --output "$current_changelog"
          node scripts/assemble-release-notes.mjs \
            --previous-tag "$previous_tag" \
            --head HEAD \
            --changelog "$current_changelog" \
            --output "$current_changelog"
          node scripts/prepend-changelog-section.mjs \
            --current "$current_changelog" \
            --existing CHANGELOG.md \
            --output CHANGELOG.md
          node scripts/check-changelog-tags.mjs
          grep -Eq '^## ' CHANGELOG.md

      - name: Commit updated files
        run: |
          git add CHANGELOG.md package.json charts/seerr-chart/Chart.yaml charts/seerr-chart/README.md
          git commit \
            -m "chore(release): prepare ${TAG_VERSION}" \
            -m "release-note: none"

      - name: Create git tag and package release candidate
        id: package-release
        run: |
          set -euo pipefail
          git tag --delete "$TAG_VERSION" >/dev/null 2>&1 || true
          git tag -- "$TAG_VERSION"
          base_sha="$(git rev-parse HEAD^)"
          release_sha="$(git rev-parse HEAD)"
          bundle_path="${RUNNER_TEMP}/seerrng-release.bundle"
          git bundle create "$bundle_path" \
            refs/heads/release-candidate \
            "refs/tags/$TAG_VERSION"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: seerrng-release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/seerrng-release.bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Clean release candidate
        if: always()
        run: rm -f -- "${RUNNER_TEMP}/seerrng-release.bundle"

  publish-tag:
    name: Publish tag
    if: needs.create-tag.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: create-tag
    outputs:
      tag_version: ${{ needs.create-tag.outputs.tag_version }}
    env:
      TAG_VERSION: ${{ needs.create-tag.outputs.tag_version }}
      BASE_SHA: ${{ needs.create-tag.outputs.base_sha }}
      RELEASE_SHA: ${{ needs.create-tag.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seerrng-release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/seerrng-release-candidate

      - name: Push release commit and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]] || {
            echo "main advanced while the release candidate was being prepared" >&2
            exit 2
          }
          bundle_path="${RUNNER_TEMP}/seerrng-release-candidate/seerrng-release.bundle"
          git tag --delete "$TAG_VERSION" >/dev/null 2>&1 || true
          candidate_ref="refs/seerrng/release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git fetch "$bundle_path" \
            "refs/heads/release-candidate:$candidate_ref" \
            "refs/tags/$TAG_VERSION:refs/tags/$TAG_VERSION"
          [[ "$(git rev-parse "$candidate_ref^")" == "$BASE_SHA" ]] || {
            echo "release candidate does not extend the prepared main revision" >&2
            exit 2
          }
          [[ "$(git rev-parse "$candidate_ref")" == "$RELEASE_SHA" ]] || {
            echo "release candidate commit does not match the prepared revision" >&2
            exit 2
          }
          askpass="${RUNNER_TEMP}/seerrng-release-git-askpass.sh"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push --atomic origin \
            "$candidate_ref:refs/heads/main" \
            "refs/tags/$TAG_VERSION:refs/tags/$TAG_VERSION"

      - name: Clean release candidate
        if: always()
        run: rm -rf -- "${RUNNER_TEMP}/seerrng-release-candidate"

  dispatch-release:
    name: Dispatch release workflow
    if: needs.publish-tag.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    needs: publish-tag
    env:
      TAG_VERSION: ${{ needs.publish-tag.outputs.tag_version }}
      REPO: ${{ github.repository }}
    steps:
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$REPO" --ref main -f "tag=$TAG_VERSION"
